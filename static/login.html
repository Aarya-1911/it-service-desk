<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Service Desk - Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Header Banner -->
    <div class="bg-slate-900 p-6 text-center text-white">
      <div class="h-12 w-12 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3 font-bold text-xl shadow-lg">
        IT
      </div>
      <h1 class="text-xl font-bold">IT Service Desk Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Authenticate to access your authorized workspace</p>
    </div>

    <!-- Login Form -->
    <div class="p-6 space-y-6">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
          Select User Account
        </label>
        <select id="userSelect" class="w-full text-sm border border-slate-300 rounded-xl p-3 bg-slate-50 font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="" disabled selected>Loading directory users...</option>
        </select>
        <p class="text-[11px] text-slate-500 mt-2">
          The system evaluates your database role and routes you to the matching portal.
        </p>
      </div>

      <div id="roleBadgeContainer" class="hidden p-3 rounded-lg border flex items-center justify-between text-xs">
        <span class="font-medium text-slate-600">Assigned Role:</span>
        <span id="roleBadge" class="font-bold px-2.5 py-1 rounded-full text-xs"></span>
      </div>

      <button onclick="handleLogin()" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-md">
        Sign In &rarr;
      </button>

      <!-- Persona Reference Card -->
      <div class="pt-4 border-t border-slate-100 text-xs space-y-2">
        <span class="font-bold text-slate-500 uppercase tracking-wider text-[10px]">Evaluation Personas</span>
        <div class="grid grid-cols-2 gap-2 text-[11px]">
          <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200">
            <span class="font-semibold text-slate-800">Alice / Bob</span>
            <p class="text-slate-500">Requester (Employee Portal)</p>
          </div>
          <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200">
            <span class="font-semibold text-slate-800">Charlie / Evan</span>
            <p class="text-slate-500">Agent / Manager (Ops Workspace)</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let usersList = [];

    function getNormalizedRole(user) {
      if (!user) return '';
      const raw = (typeof user.role === 'object' && user.role !== null) ? user.role.value : user.role;
      return String(raw || '').trim().toUpperCase();
    }

    async function loadUsers() {
      try {
        const res = await fetch('/users');
        usersList = await res.json();
        const select = document.getElementById('userSelect');
        select.innerHTML = '';

        usersList.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.name} (${u.role}) - ${u.email}`;
          select.appendChild(opt);
        });

        select.addEventListener('change', updateRoleBadge);
        updateRoleBadge();
      } catch (err) {
        console.error('Failed to connect to backend user directory:', err);
      }
    }

    function updateRoleBadge() {
      const select = document.getElementById('userSelect');
      const selectedId = parseInt(select.value);
      const user = usersList.find(u => u.id === selectedId);

      if (!user) return;

      const container = document.getElementById('roleBadgeContainer');
      const badge = document.getElementById('roleBadge');
      container.classList.remove('hidden');

      const role = getNormalizedRole(user);

      if (role === 'REQUESTER') {
        container.className = 'p-3 rounded-lg border border-indigo-200 bg-indigo-50 flex items-center justify-between text-xs';
        badge.className = 'font-bold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700';
        badge.textContent = 'EMPLOYEE (Requester)';
      } else {
        container.className = 'p-3 rounded-lg border border-emerald-200 bg-emerald-50 flex items-center justify-between text-xs';
        badge.className = 'font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
        badge.textContent = `${user.role} (IT Operations)`;
      }
    }

    function handleLogin() {
      const select = document.getElementById('userSelect');
      const userId = parseInt(select.value);
      const user = usersList.find(u => u.id === userId);

      if (!user) return;

      // Save user session
      localStorage.setItem('auth_user', JSON.stringify(user));

      const role = getNormalizedRole(user);

      // Clean, direct redirect to the respective portal
      if (role === 'REQUESTER') {
        window.location.replace('/employee');
      } else {
        window.location.replace('/agent');
      }
    }

    window.onload = loadUsers;
  </script>
</body>
</html>
