<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Self-Service Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

  <!-- Top Navigation -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">EP</div>
      <div>
        <h1 class="font-bold text-lg text-slate-900 leading-tight">Employee Self-Service Portal</h1>
        <p class="text-xs text-slate-500">Internal Support & Issue Tracking</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-right">
        <p id="authUserName" class="text-xs font-bold text-slate-900"></p>
        <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold">Requester</span>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">
        Logout
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Form: Raise Ticket -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 lg:col-span-1">
      <h2 class="text-base font-bold text-slate-900 mb-1">Create Service Request</h2>
      <p class="text-xs text-slate-500 mb-4">Submit an incident or request for IT assistance.</p>
      
      <form id="createTicketForm" onsubmit="handleCreateTicket(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
          <select id="reqCategory" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 bg-slate-50">
            <option value="1">Hardware (Laptops, Monitors)</option>
            <option value="2">Software (OS, Office 365, IDE)</option>
            <option value="3">Network & VPN</option>
            <option value="4">Access & Permissions</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Priority (Dynamic SLA)</label>
          <select id="reqPriority" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 bg-slate-50">
            <option value="Low">Low (48h SLA)</option>
            <option value="Medium">Medium (24h SLA)</option>
            <option value="High">High (8h SLA)</option>
            <option value="Critical">Critical (4h SLA)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Subject</label>
          <input type="text" id="reqSubject" required placeholder="Short summary of issue" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Detailed Description</label>
          <textarea id="reqDesc" rows="3" required placeholder="Describe error codes, symptoms..." class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
          Submit Ticket
        </button>
      </form>
    </section>

    <!-- Table: My Submitted Tickets -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 lg:col-span-2">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2 class="text-base font-bold text-slate-900">My Requests</h2>
          <p class="text-xs text-slate-500">Track tickets raised by your employee profile</p>
        </div>
        <button onclick="loadEmployeeTickets()" class="text-xs text-indigo-600 hover:bg-indigo-50 px-2 py-1 rounded font-medium transition">Refresh</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500 uppercase tracking-wider">
              <th class="py-2.5 px-3">Ticket ID</th>
              <th class="py-2.5 px-3">Subject</th>
              <th class="py-2.5 px-3">Priority</th>
              <th class="py-2.5 px-3">Status</th>
              <th class="py-2.5 px-3">SLA Target</th>
            </tr>
          </thead>
          <tbody id="employeeTicketTable" class="divide-y divide-slate-100 text-slate-700">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // 1. Session Guard: Ensure user is logged in
    const user = JSON.parse(localStorage.getItem('auth_user') || 'null');
    if (!user) {
      window.location.href = '/login';
    } else {
      document.getElementById('authUserName').textContent = user.name;
    }

    function logout() {
      localStorage.removeItem('auth_user');
      window.location.href = '/login';
    }

    // 2. Load requests strictly belonging to this employee
    async function loadEmployeeTickets() {
      try {
        const res = await fetch('/requests');
        const data = await res.json();
        
        const myTickets = data.filter(t => t.requester_id === user.id);
        const table = document.getElementById('employeeTicketTable');
        table.innerHTML = '';

        if (myTickets.length === 0) {
          table.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">No tickets submitted by you yet.</td></tr>`;
          return;
        }

        const priorityColors = {
          'Critical': 'bg-red-100 text-red-700 border border-red-200 font-bold',
          'High':     'bg-orange-100 text-orange-700 border border-orange-200 font-semibold',
          'Medium':   'bg-amber-100 text-amber-800 border border-amber-200 font-medium',
          'Low':      'bg-slate-100 text-slate-700 border border-slate-200 font-medium'
        };

        myTickets.forEach(t => {
          const badgeColor = t.status === 'Resolved' || t.status === 'Closed' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
          const priorityBadge = `<span class="px-2 py-0.5 rounded-full text-[11px] ${priorityColors[t.priority] || 'bg-slate-100 text-slate-700'}">${t.priority}</span>`;

          table.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="py-3 px-3 font-semibold text-slate-900">#${t.id}</td>
              <td class="py-3 px-3 font-medium text-slate-900">${t.subject}</td>
              <td class="py-3 px-3">${priorityBadge}</td>
              <td class="py-3 px-3"><span class="px-2 py-0.5 rounded-full font-medium ${badgeColor}">${t.status}</span></td>
              <td class="py-3 px-3 text-slate-500">${t.sla_due_at ? new Date(t.sla_due_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A'}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    // 3. Create ticket with authenticated employee user id
    async function handleCreateTicket(e) {
      e.preventDefault();
      const payload = {
        requester_id: user.id,
        category_id: parseInt(document.getElementById('reqCategory').value),
        priority: document.getElementById('reqPriority').value,
        subject: document.getElementById('reqSubject').value,
        description: document.getElementById('reqDesc').value
      };

      const res = await fetch('/requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById('reqSubject').value = '';
        document.getElementById('reqDesc').value = '';
        loadEmployeeTickets();
        alert('Ticket submitted successfully with active SLA computation!');
      } else {
        const err = await res.json();
        alert('Submission failed: ' + JSON.stringify(err.detail));
      }
    }

    window.onload = loadEmployeeTickets;
  </script>
</body>
</html>
